version: 2

models:
  - name: stg_claims
    description: "Cleaned claim headers, one row per claim_id"
    columns:
      - name: claim_id
        data_tests:
          - unique
          - not_null
  - name: stg_claim_lines
    description: "Cleaned claim lines, one row per claim_line_id"
    columns:
      - name: claim_line_id
        data_tests:
          - unique
          - not_null
  - name: stg_claim_status_events
    description: "Cleaned append-only status events"
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
  - name: stg_members
    description: "Cleaned members, one row per member_id"
    columns:
      - name: member_id
        data_tests:
          - unique
          - not_null
  - name: stg_providers
    description: "Cleaned providers, one row per provider_id"
    columns:
      - name: provider_id
        data_tests:
          - unique
          - not_null
  - name: stg_schemes
    description: "Cleaned schemes, one row per scheme_id"
    columns:
      - name: scheme_id
        data_tests:
          - unique
          - not_null
