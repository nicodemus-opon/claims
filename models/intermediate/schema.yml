version: 2

models:
  - name: int_claim_current_status
    description: "Current status of each claim derived from the append-only event log. One row per claim_id; latest event by changed_at, ties broken by higher event_id."
    columns:
      - name: claim_id
        description: "Claim identifier"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_claims')
                field: claim_id
      - name: current_status
        description: "Most recent claim status"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['received', 'in_review', 'approved', 'rejected', 'paid']
      - name: status_changed_at
        description: "changed_at of the winning event"
        data_tests:
          - not_null
      - name: status_changed_by
        description: "changed_by of the winning event"
      - name: current_event_id
        description: "event_id of the winning event (higher id on ties)"
        data_tests:
          - not_null
          - unique
